# Script. Settings > Automations & scenes > Scripts > Add script > three-dot menu > Edit in YAML.
# Save it as script.outdoor_resolve_theme (the entity id comes from the name).
alias: Outdoor Resolve Theme
icon: mdi:calendar-star
mode: single
description: 'Picks tonight''s outdoor lighting theme key from the holiday calendar, a team schedule calendar
  and an optional club team calendar, and writes it to input_text.outdoor_theme_key. The display name
  goes to input_text.porch_theme. First matching rule wins; a rule matches when its keyword is in an event
  summary and the event is 0..lead-window days away. Precedence: a manual pick on input_select.outdoor_theme_override
  (anything but Auto), then the live match window, then the holiday itself, then a club team game, then
  holiday lead-up days, then a team game day, then white. Touches no lights.'
sequence:
- action: calendar.get_events
  target:
    entity_id: calendar.holidays
  data:
    start_date_time: '{{ today_at(''00:00'') }}'
    end_date_time: '{{ today_at(''00:00'') + timedelta(days=25) }}'
  response_variable: holiday_events
  continue_on_error: true
  note: 'Explicit start/end: a duration counts from now and breaks the lead windows. continue_on_error:
    an unavailable calendar leaves holiday_events undefined and the rules template falls back to an empty
    list.'
- action: calendar.get_events
  target:
    entity_id: calendar.team_schedule
  data:
    start_date_time: '{{ today_at(''00:00'') }}'
    end_date_time: '{{ today_at(''00:00'') + timedelta(days=1) }}'
  response_variable: team_events
  continue_on_error: true
  note: The team's schedule calendar. Only timed events whose title contains the team name (see is_game_day
    below) count as a game day.
- action: calendar.get_events
  target:
    entity_id: '{{ states.calendar | selectattr(''name'', ''search'', ''(?i)club team'') | map(attribute=''entity_id'')
      | list }}'
  data:
    start_date_time: '{{ today_at(''00:00'') }}'
    end_date_time: '{{ today_at(''00:00'') + timedelta(days=1) }}'
  response_variable: youth_events
  continue_on_error: true
  note: 'Optional club or youth team calendar(s), found by name so a renamed or replacement subscription
    is picked up without edits. Change the pattern to match your calendar''s name. continue_on_error:
    no matching calendar leaves youth_events undefined.'
- variables:
    is_game_day: |-
      {%- set day = now().date() | string -%}
      {%- set ns = namespace(n=0) -%}
      {%- for resp in [team_events if team_events is defined else {}] -%}
      {%- for cal in (resp.values() | list) -%}
      {%- for e in cal.get('events', []) -%}
      {%- set s = e.start | string -%}
      {%- if s | length > 10 and (as_datetime(s) | as_local).date() | string == day and 'my team' in (e.summary | default('') | lower) -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}{%- endfor -%}
      {{ ns.n > 0 }}
    chosen_rule: |-
      {%- set events = holiday_events.get('calendar.holidays', {}).get('events', []) if holiday_events is defined else [] -%}
      {%- set rules = [
        ['Christmas Day','christmas',25,'Christmas'],
        ['Halloween','halloween',15,'Halloween'],
        ['Thanksgiving Day','thanksgiving',10,'Thanksgiving'],
        ["New Year's Day",'new_year',4,'New Year'],
        ['Independence Day','independence',4,'Fourth of July'],
        ['Memorial Day','memorial',0,'Memorial Day'],
        ['Juneteenth','civic',0,'Juneteenth'],
        ['Labor Day','civic',0,'Labor Day'],
        ['Washington','civic',0,'Presidents Day'],
        ['King','mlk',0,'MLK Day'],
        ['Valentine','valentines',0,"Valentine's Day"],
        ['Patrick','st_patricks',0,"St. Patrick's Day"]
      ] -%}
      {%- set today = now().date() -%}
      {%- set pick = namespace(key='none') -%}
      {%- for r in rules if pick.key == 'none' -%}
      {%- for e in events if pick.key == 'none' -%}
      {%- if r[0] in e.summary -%}
      {%- set raw = e.start -%}
      {%- set ds = (raw if raw is string else (raw.date if raw.date is defined else (raw.dateTime if raw.dateTime is defined else ''))) | string -%}
      {%- if ds | length >= 10 -%}
      {%- set delta = (strptime(ds[:10], '%Y-%m-%d').date() - today).days -%}
      {%- if delta >= 0 and delta <= r[2] -%}{%- set pick.key = r[1] ~ '|' ~ r[3] ~ '|' ~ delta -%}{%- endif -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- pick.key -}}
    is_youth_game: |-
      {%- set day = now().date() | string -%}
      {%- set ns = namespace(n=0) -%}
      {%- for cal in ((youth_events if youth_events is defined else {}).values() | list) -%}
      {%- for e in cal.get('events', []) -%}
      {%- set s = e.start | string -%}
      {%- if s | length > 10 and (as_datetime(s) | as_local).date() | string == day and ' - game' in (e.summary | default('') | lower) -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}
      {{ ns.n > 0 }}
  note: 'Rules rows: keyword, theme key, lead-window days, display name. calendar.get_events start/end
    are plain ISO strings (date-only for all-day events), so the date math uses strptime(...).date().
    is_game_day: a timed event starting today (local time) whose title contains the team name (lowercase
    ''my team'' here, change it), any case. All-day events are ignored. chosen_rule = key|display name|days
    until the holiday, or none. is_youth_game: a timed event starting today whose title contains '' -
    Game'' on a club team calendar (practices and training are skipped).'
- variables:
    theme_key: '{%- set ov = states(''input_select.outdoor_theme_override'') -%}{%- set m = {''Paint:
      LIFX theme'': ''paint_theme'', ''Paint: my colours'': ''paint_custom'', ''Christmas'': ''christmas'',
      ''Halloween'': ''halloween'', ''Thanksgiving'': ''thanksgiving'', ''New Year'': ''new_year'', ''Fourth
      of July'': ''independence'', ''USA'': ''civic'', ''Memorial Day'': ''memorial'', ''MLK Day'': ''mlk'',
      "Valentine''s Day": ''valentines'', "St. Patrick''s Day": ''st_patricks'', ''Game day'': ''team'',
      ''Club team'': ''club_team'', ''White'': ''white''} -%}{%- if ov in m -%}{{ m[ov] }}{%- else -%}{%-
      set r = (chosen_rule | trim).split(''|'') -%}{%- set has = r[0] != ''none'' -%}{%- set day_of =
      has and (r[2] | int(99)) == 0 -%}{%- if is_state(''input_boolean.match_window'', ''on'') -%}team{%-
      elif day_of -%}{{ r[0] }}{%- elif is_youth_game -%}club_team{%- elif has -%}{{ r[0] }}{%- elif is_game_day
      -%}team{%- else -%}white{%- endif -%}{%- endif -%}'
    theme_name: '{%- set ov = states(''input_select.outdoor_theme_override'') -%}{%- set m = {''Paint:
      LIFX theme'': ''paint_theme'', ''Paint: my colours'': ''paint_custom'', ''Christmas'': ''christmas'',
      ''Halloween'': ''halloween'', ''Thanksgiving'': ''thanksgiving'', ''New Year'': ''new_year'', ''Fourth
      of July'': ''independence'', ''USA'': ''civic'', ''Memorial Day'': ''memorial'', ''MLK Day'': ''mlk'',
      "Valentine''s Day": ''valentines'', "St. Patrick''s Day": ''st_patricks'', ''Game day'': ''team'',
      ''Club team'': ''club_team'', ''White'': ''white''} -%}{%- if ov == ''Paint: LIFX theme'' -%}Painted:
      {{ states(''input_select.outdoor_paint_theme'') | replace(''_'', '' '') | title }}{%- elif ov ==
      ''Paint: my colours'' -%}Painted: my colours{%- elif ov in m -%}{{ ov }} (manual){%- else -%}{%-
      set r = (chosen_rule | trim).split(''|'') -%}{%- set has = r[0] != ''none'' -%}{%- set day_of =
      has and (r[2] | int(99)) == 0 -%}{%- if is_state(''input_boolean.match_window'', ''on'') -%}Match
      live{%- elif day_of -%}{{ r[1] }}{%- elif is_youth_game -%}Club team game day{%- elif has -%}{{
      r[1] }}{%- elif is_game_day -%}Game day{%- else -%}White{%- endif -%}{%- endif -%}'
  note: 'Precedence: a manual pick on input_select.outdoor_theme_override (anything but Auto) wins over
    everything. Otherwise: the live match window, then the holiday itself, then a club team game, then
    holiday lead-up days, then a team game day from the schedule calendar, then white.'
- action: input_text.set_value
  target:
    entity_id: input_text.outdoor_theme_key
  data:
    value: '{{ theme_key }}'
- action: input_text.set_value
  target:
    entity_id: input_text.porch_theme
  data:
    value: '{{ theme_name }}'
  continue_on_error: true
  note: Read by the dashboards; last step so it cannot affect the lights.
