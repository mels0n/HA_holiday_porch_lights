# Automation. Settings > Automations & scenes > Create automation > three-dot menu > Edit in YAML.
alias: Nightly outdoor lights
description: Runs the outdoor lights from 30 minutes before sunset until 23:59, themed for holidays, games
  and manual picks. At sunset-30 it runs script.outdoor_resolve_theme then script.outdoor_apply_theme
  on every member of light.outdoor_lights. On an HA start it runs script.outdoor_lights_fix, which
  re-applies inside the window and turns the lights off outside it. At 23:59 it resets input_select.outdoor_theme_override
  to Auto and runs script.outdoor_lights_off (stops the bulb chase, the goal show and strand effects,
  then turns light.outdoor_lights off). A change on the
  Holiday Lights dashboard view (theme pick, or paint settings while a manual theme is picked) runs script.outdoor_lights_fix.
  Pressing Run on this automation also runs script.outdoor_lights_fix. Lights-off is its own trigger so
  a restart or a script error cannot skip it.
triggers:
- trigger: sun
  event: sunset
  offset: -00:30:00
  id: lights_on
- trigger: time
  at: '23:59:00'
  id: lights_off
- trigger: homeassistant
  event: start
  id: ha_start
  note: 'Missed-run reconciler: if HA was down at sunset-30 the lights would stay off for the evening,
    and if it was down at 23:59 they would stay on.'
- trigger: state
  entity_id: input_select.outdoor_theme_override
  id: override
  note: Theme picked on the Holiday Lights dashboard (or set back to Auto).
- trigger: state
  entity_id:
  - input_select.outdoor_paint_theme
  - input_number.outdoor_paint_colour_1
  - input_number.outdoor_paint_colour_2
  - input_number.outdoor_paint_colour_3
  - input_number.outdoor_paint_speed
  for:
    seconds: 2
  id: paint
  note: Paint settings changed; only acts while a manual theme is picked.
conditions: []
actions:
- choose:
  - alias: Sunset - resolve and apply tonight's theme
    conditions:
    - condition: trigger
      id:
      - lights_on
    sequence:
    - action: script.outdoor_resolve_theme
      data: {}
    - action: script.outdoor_apply_theme
      data: {}
  - alias: 23:59 - stop effects and turn the outside lights off
    conditions:
    - condition: trigger
      id:
      - lights_off
    sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.outdoor_theme_override
      data:
        option: Auto
      note: A manual theme or paint lasts until 23:59, then the calendar takes over again.
    - action: script.outdoor_lights_off
  - alias: HA start - fix (re-applies inside the evening window, turns off outside it)
    conditions:
    - condition: trigger
      id:
      - ha_start
    sequence:
    - action: script.outdoor_lights_fix
      note: Outside the window Fix turns the lights off, so a restart that spanned 23:59 cannot leave
        them on. Inside the window it re-picks and re-applies tonight's theme.
  - alias: Dashboard theme pick changed - fix (applies, or turns off outside the window when back to Auto)
    conditions:
    - condition: trigger
      id:
      - override
    sequence:
    - action: script.outdoor_lights_fix
  - alias: Paint settings changed while a manual theme is picked - fix
    conditions:
    - condition: trigger
      id:
      - paint
    - condition: not
      conditions:
      - condition: state
        entity_id: input_select.outdoor_theme_override
        state: Auto
    sequence:
    - action: script.outdoor_lights_fix
  default:
  - action: script.outdoor_lights_fix
    note: 'Manual Run (no trigger) = the Fix button: re-pick and re-apply now, or turn off outside the
      evening window.'
mode: queued
max: 5
