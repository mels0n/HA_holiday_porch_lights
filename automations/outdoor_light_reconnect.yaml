# Automation. Settings > Automations & scenes > Create automation > three-dot menu > Edit in YAML.
alias: Outdoor light reconnect
description: When a member of light.outdoor_lights becomes available again (tracked by sensor.outdoor_lights_available),
  applies the active outdoor theme to just that light, between sunset-30 and 23:59. If you also run automations
  that restore lights when they reconnect, make them skip members of light.outdoor_lights so they do not
  fight this one.
triggers:
- trigger: state
  entity_id: sensor.outdoor_lights_available
  not_from:
  - unknown
  - unavailable
  not_to:
  - unknown
  - unavailable
  id: availability_changed
conditions:
- condition: sun
  after: sunset
  after_offset: -00:30:00
- condition: time
  before: '23:59:00'
actions:
- variables:
    newly_available: '{{ (trigger.to_state.state.split('','') | reject(''eq'', '''') | list) | reject(''in'',
      (trigger.from_state.state.split('','') | list)) | list }}'
- delay:
    seconds: 3
- repeat:
    for_each: '{{ newly_available }}'
    sequence:
    - action: script.outdoor_apply_theme
      data:
        target: '{{ repeat.item }}'
      continue_on_error: true
mode: queued
max: 5
