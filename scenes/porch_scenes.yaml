# Example scenes, in the format of scenes.yaml. Each assumes a two-bulb porch:
# a left bulb and a right bulb, one colour each. Recolour them in the scene
# editor (Settings > Automations & scenes > Scenes) after importing.
# hs_color is [hue 0-360, saturation 0-100]; brightness is 0-255.
- id: porch_christmas
  name: Porch Christmas
  icon: mdi:pine-tree
  entities:
    light.porch_left:
      state: "on"
      color_mode: hs
      hs_color: [0, 100]
      brightness: 255
    light.porch_right:
      state: "on"
      color_mode: hs
      hs_color: [120, 100]
      brightness: 255
